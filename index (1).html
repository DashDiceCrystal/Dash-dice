<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e3d14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dice Dash">
  <meta name="description" content="The progressive 10,000-style dice game to 12,000 — online multiplayer, persistent scores, level-up dice skins.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Dice Dash 12,000 — Progressive Dice Game</title>
  <style>
    /* Felt table theme - green background, warm lighting (Crystal's original look) */
    body {
      font-family: 'Arial Black', Arial, sans-serif;
      background: linear-gradient(135deg, #2d5a27 0%, #1e3d14 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    h1 {
      font-size: 2.5em;
      margin: 0 0 20px;
      text-align: center;
      color: #ffd700;
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #ffd700; }
      to { text-shadow: 0 0 20px #ffd700, 0 0 30px #ffd700; }
    }
    h2 { color: #ffd700; margin-top: 0; }
    .game-board {
      background: rgba(0, 100, 0, 0.3);
      border: 5px solid #8b4513;
      border-radius: 20px;
      padding: 30px;
      max-width: 800px;
      width: 95%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }
    .player-panel {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .player {
      background: rgba(255,255,255,0.1);
      border: 2px solid #ffd700;
      border-radius: 15px;
      padding: 15px;
      min-width: 120px;
      text-align: center;
      transition: all 0.3s;
    }
    .player.current {
      background: rgba(255,215,0,0.3);
      transform: scale(1.1);
      box-shadow: 0 0 20px #ffd700;
    }
    .player.leader { border-color: #ff4500; }
    .player-score { font-size: 1.5em; font-weight: bold; color: #ffd700; }
    .turn-total { font-size: 1.2em; color: #90ee90; }
    #dice-area {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin: 30px 0;
      min-height: 120px;
    }
    /* Dice: 3x3 grid pips, level skins */
    .die {
      width: 80px;
      height: 80px;
      border: 3px solid #333;
      border-radius: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 8px;
      box-sizing: border-box;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      background: #fff;
    }
    .die.clickable:hover { transform: scale(1.05); }
    .die:not(.clickable) { cursor: default; }
    .die.selected {
      border-color: #ffd700;
      box-shadow: 0 0 20px #ffd700;
      animation: pulse 1s infinite;
    }
    .die.rolled { animation: rollShake 0.6s ease-in-out; }
    @keyframes rollShake {
      0%, 100% { transform: translate(0); }
      25% { transform: translate(5px, -5px) rotate(5deg); }
      75% { transform: translate(-5px, 5px) rotate(-5deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .pip {
      width: 75%;
      height: 75%;
      border-radius: 50%;
      background: #333;
      place-self: center;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.3);
    }
    /* Level skins (unlocked by playing games) */
    .die.skin-1 { background: #ffd9d9; border-color: #8b1a1a; }
    .die.skin-1 .pip { background: #8b1a1a; }
    .die.skin-2 { background: #1c1c2a; border-color: #5555aa; }
    .die.skin-2 .pip { background: #ddd; }
    .die.skin-3 { background: #fff3c4; border-color: #b8860b; }
    .die.skin-3 .pip { background: #7a5c00; }
    .die.skin-4 { background: #e8fbff; border-color: #00bcd4; box-shadow: 0 0 12px #00bcd4; }
    .die.skin-4 .pip { background: #006978; }
    .die.skin-5 { background: #f3e8ff; border-color: #7b2ff7; }
    .die.skin-5 .pip { background: #4a1a9e; }
    .die.skin-6 { background: #ffffff; border-color: #444; box-shadow: 0 0 14px rgba(255,255,255,0.9); }
    .die.skin-6 .pip { background: linear-gradient(135deg, #667eea, #764ba2); }
    .die.skin-7 { background: linear-gradient(135deg, #0f0c29, #302b63); border-color: #00f5ff; box-shadow: 0 0 16px #00f5ff; }
    .die.skin-7 .pip { background: radial-gradient(circle, #ffffff, #00f5ff); }
    .history-row {
      background: rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 10px 14px;
      margin: 6px 0;
      font-size: 0.95em;
    }
    button {
      background: linear-gradient(#ffd700, #ffed4e);
      border: none;
      border-radius: 15px;
      padding: 15px 30px;
      font-size: 1.2em;
      font-weight: bold;
      color: #333;
      cursor: pointer;
      margin: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: all 0.2s;
      min-width: 120px;
      text-shadow: none;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 7px 20px rgba(0,0,0,0.4); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    input, select {
      padding: 12px;
      font-size: 1.1em;
      border-radius: 10px;
      border: 2px solid #ffd700;
      margin: 10px;
      font-family: Arial, sans-serif;
    }
    #join-code { width: 120px; text-transform: uppercase; text-align: center; }
    #message {
      font-size: 1.4em;
      text-align: center;
      margin: 20px 0;
      min-height: 40px;
      padding: 15px;
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
    }
    #turn-info {
      text-align: center;
      font-size: 1em;
      color: #90ee90;
      min-height: 24px;
      margin-bottom: 10px;
    }
    .win { color: #ff4500; font-size: 2em; animation: celebrate 1s infinite; }
    @keyframes celebrate {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    .error { color: #ff8888; margin-top: 10px; min-height: 24px; }
    .row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; }
    #room-code-big {
      font-size: 3em;
      color: #ffd700;
      letter-spacing: 0.3em;
      text-align: center;
      margin: 10px 0;
    }
    .room-player {
      background: rgba(255,255,255,0.1);
      border: 2px solid #ffd700;
      border-radius: 10px;
      padding: 10px 20px;
      margin: 5px;
    }
    table.lb { width: 100%; border-collapse: collapse; margin-top: 10px; }
    table.lb td, table.lb th { padding: 8px; border-bottom: 1px solid rgba(255,215,0,0.3); text-align: left; }
    table.lb th { color: #ffd700; }
    @media (max-width: 600px) {
      /* Phone fit (Miniclip-style): everything scales to the screen, no sideways scroll */
      body { padding: 8px; }
      h1 { font-size: 1.6em; margin-bottom: 10px; }
      .game-board { padding: 15px; }
      #dice-area { gap: 8px; margin: 15px 0; min-height: 0; }
      .die { width: clamp(44px, 12vw, 60px); height: clamp(44px, 12vw, 60px); padding: 5px; }
      button { padding: 12px 20px; font-size: 1.05em; margin: 6px; }
      #message { font-size: 1.1em; padding: 10px; margin: 10px 0; }
      #room-code-big { font-size: 2.2em; }
      .player { padding: 10px; min-width: 90px; }
    }
  </style>
</head>
<body>
  <h1>🎲 Crystal's 12,000 Dice Dash 🎲</h1>

  <!-- AUTH -->
  <section id="screen-auth" class="game-board">
    <h2>Log in / Sign up</h2>
    <div class="row">
      <input id="auth-user" placeholder="username" maxlength="20" autocomplete="username">
      <input id="auth-pass" type="password" placeholder="password" autocomplete="current-password">
    </div>
    <div class="row">
      <button onclick="doRegister()">Sign up</button>
      <button onclick="doLogin()">Log in</button>
    </div>
    <div id="auth-error" class="error"></div>
    <p style="opacity:0.8">Your scores, wins and level are saved to your account.</p>
  </section>

  <!-- LOBBY -->
  <section id="screen-lobby" class="game-board" hidden>
    <div id="profile-line"></div>
    <h2>Play</h2>
    <div class="row">
      <select id="bank-rule">
        <option value="house">House rule: bank with 1 die left</option>
        <option value="classic">Classic: bank with 2 dice left</option>
      </select>
      <button onclick="doCreateRoom()">Create Room</button>
    </div>
    <div class="row">
      <input id="join-code" placeholder="CODE" maxlength="4">
      <button onclick="doJoinRoom()">Join Room</button>
    </div>
    <div id="lobby-error" class="error"></div>
    <h2>Leaderboard</h2>
    <div id="leaderboard">Loading…</div>
    <h2>Recent games</h2>
    <div id="recent-games">Loading…</div>
    <div class="row"><button onclick="doLogout()">Log out</button></div>
  </section>

  <!-- ROOM -->
  <section id="screen-room" class="game-board" hidden>
    <h2>Room</h2>
    <div id="room-code-big">----</div>
    <p style="text-align:center; opacity:0.85">Share this code with your crew. 2–6 players.</p>
    <div class="row" id="room-players"></div>
    <div class="row">
      <button id="start-btn" onclick="doStartGame()">Start Game</button>
      <button onclick="doLeaveRoom()">Leave</button>
    </div>
    <div id="room-error" class="error"></div>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="game-board" hidden>
    <div class="player-panel" id="player-panel"></div>
    <div id="message">Waiting…</div>
    <div id="turn-info"></div>
    <div id="dice-area"></div>
    <div id="standings"></div>
    <div class="row" id="gameover-actions" hidden>
      <button id="rematch-btn" onclick="doRematch()">🔄 Rematch</button>
      <button onclick="doLeaveRoom()">Back to lobby</button>
    </div>
    <div class="row">
      <button id="roll-btn" onclick="doRoll()">Roll Dice</button>
      <button id="keep-btn" onclick="doKeep()">Keep Selected</button>
      <button id="bank-btn" onclick="doBank()">Bank Score</button>
    </div>
    <div class="row"><button onclick="doLeaveRoom()" style="font-size:0.9em; padding:10px 20px;">Leave game</button></div>
  </section>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script>
    let token = localStorage.getItem('farkle_token');
    let me = null;
    let socket = null;
    let room = null;
    let game = null;
    let selected = new Set();
    let skinClass = 'skin-0';

    const $ = id => document.getElementById(id);
    function show(id) {
      ['screen-auth','screen-lobby','screen-room','screen-game'].forEach(s => $(s).hidden = (s !== id));
    }
    function err(id, msg) { $(id).textContent = msg || ''; }

    async function api(path, method = 'GET', body) {
      const res = await fetch(path, {
        method,
        headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'request failed');
      return data;
    }

    // ---------- auth ----------
    async function doRegister() {
      try {
        const d = await api('/api/register', 'POST', { username: $('auth-user').value, password: $('auth-pass').value });
        token = d.token; localStorage.setItem('farkle_token', token);
        await enterLobby();
      } catch (e) { err('auth-error', e.message); }
    }
    async function doLogin() {
      try {
        const d = await api('/api/login', 'POST', { username: $('auth-user').value, password: $('auth-pass').value });
        token = d.token; localStorage.setItem('farkle_token', token);
        await enterLobby();
      } catch (e) { err('auth-error', e.message); }
    }
    function doLogout() {
      token = null; localStorage.removeItem('farkle_token');
      if (socket) { socket.disconnect(); socket = null; }
      room = null; game = null;
      show('screen-auth');
    }

    // ---------- lobby ----------
    async function enterLobby() {
      const d = await api('/api/me');
      me = d.user;
      skinClass = 'skin-' + Math.min(me.level - 1, 7);
      const progress = me.nextSkin
        ? ` · ${me.gamesToNextLevel} game${me.gamesToNextLevel === 1 ? '' : 's'} to Level ${me.level + 1} (${esc(me.nextSkin)} dice)`
        : ' · max level 👑';
      $('profile-line').innerHTML =
        `<b>${esc(me.username)}</b> · Level ${me.level} · 🎲 ${esc(me.diceSkin)}` +
        ` · ${me.gamesPlayed} games · ${me.wins} wins · ${me.totalPoints.toLocaleString()} pts${progress}`;
      const lb = await api('/api/leaderboard');
      $('leaderboard').innerHTML = lb.leaderboard.length
        ? '<table class="lb"><tr><th>#</th><th>Player</th><th>Wins</th><th>Points</th><th>Level</th></tr>' +
          lb.leaderboard.map((p, i) =>
            `<tr><td>${i+1}</td><td>${esc(p.username)}</td><td>${p.wins}</td><td>${p.totalPoints.toLocaleString()}</td><td>${p.level}</td></tr>`).join('') +
          '</table>'
        : 'No players yet. Be the first legend.';
      try {
        const h = await api('/api/history');
        $('recent-games').innerHTML = h.games.length
          ? h.games.map(g =>
              `<div class="history-row">🏆 <b>${esc(g.winner)}</b>` +
              ` · ${g.playerCount} players` +
              ` · ${g.scores.map(s => `${esc(s.username)} ${s.score.toLocaleString()}`).join(' · ')}` +
              `${g.winReason === 'sixOfAKind' ? ' · ⚡ instant win' : ''}</div>`).join('')
          : 'No games played yet.';
      } catch (e) { $('recent-games').textContent = ''; }
      connectSocket();
      show('screen-lobby');
    }

    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    // ---------- socket ----------
    function connectSocket() {
      if (socket) socket.disconnect();
      socket = io({ auth: { token } });
      socket.on('connect_error', e => err('lobby-error', 'Connection failed: ' + e.message));
      socket.on('state', onState);
    }

    function doCreateRoom() {
      socket.emit('createRoom', { bankRule: $('bank-rule').value }, ack => {
        if (!ack.ok) err('lobby-error', ack.error);
      });
    }
    function doJoinRoom() {
      const code = $('join-code').value.trim().toUpperCase();
      if (!code) return err('lobby-error', 'Enter a room code.');
      socket.emit('joinRoom', { code }, ack => {
        if (!ack.ok) err('lobby-error', ack.error);
      });
    }
    function doStartGame() {
      socket.emit('startGame', {}, ack => {
        if (!ack.ok) err('room-error', ack.error);
      });
    }
    function doLeaveRoom() {
      if (socket) socket.emit('leaveRoom', {}, () => {});
      room = null; game = null; selected = new Set();
      enterLobby();
    }

    // ---------- game actions ----------
    function doRoll() {
      socket.emit('roll', {}, ack => {
        if (!ack.ok) setMessage('⚠️ ' + ack.error);
      });
    }
    function doKeep() {
      if (selected.size === 0) return setMessage('Select dice to keep first.');
      socket.emit('keep', { indices: [...selected] }, ack => {
        if (!ack.ok) setMessage('⚠️ ' + ack.error);
        else selected = new Set();
      });
    }
    function doBank() {
      socket.emit('bank', {}, ack => {
        if (!ack.ok) setMessage('⚠️ ' + ack.error);
      });
    }
    function doRematch() {
      socket.emit('rematch', {}, ack => {
        if (!ack.ok) setMessage('⚠️ ' + ack.error);
      });
    }

    // ---------- rendering ----------
    const PIP_POS = {
      1: [5], 2: [3, 7], 3: [1, 5, 9],
      4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9],
    };

    function createDie(value, index, clickable) {
      const die = document.createElement('div');
      die.className = 'die ' + skinClass + (clickable ? ' clickable' : '');
      for (const pos of PIP_POS[value]) {
        const pip = document.createElement('div');
        pip.className = 'pip';
        pip.style.gridArea = `${Math.ceil(pos / 3)} / ${((pos - 1) % 3) + 1}`;
        die.appendChild(pip);
      }
      if (clickable) {
        if (selected.has(index)) die.classList.add('selected');
        die.onclick = () => {
          if (selected.has(index)) { selected.delete(index); die.classList.remove('selected'); }
          else { selected.add(index); die.classList.add('selected'); }
          paintButtons();
        };
      }
      // roll-in animation
      die.classList.add('rolled');
      setTimeout(() => die.classList.remove('rolled'), 650);
      return die;
    }

    function setMessage(msg, isWin = false) {
      const el = $('message');
      el.textContent = msg;
      el.className = isWin ? 'win' : '';
    }

    function playerName(userId) {
      const p = room && room.players.find(p => p.userId === userId);
      return p ? p.username : 'Player';
    }
    function isMyTurn() {
      return !!(game && game.phase === 'play' && game.turn && me &&
        game.players[game.current].id === me.id);
    }

    function onState(payload) {
      room = payload.room;
      game = payload.game;
      selected = new Set();
      if (!game) { renderRoom(); show('screen-room'); }
      else { renderGame(payload.lastEvent); show('screen-game'); }
    }

    function renderRoom() {
      $('room-code-big').textContent = room.code;
      $('room-players').innerHTML = room.players
        .map(p => `<div class="room-player">${esc(p.username)}${p.userId === room.hostId ? ' 👑' : ''}</div>`).join('');
      $('start-btn').style.display = (me && room.hostId === me.id) ? '' : 'none';
      err('room-error', '');
    }

    function renderGame(lastEvent) {
      // reset game-over UI (shown again below if the game is over)
      $('standings').innerHTML = '';
      $('gameover-actions').hidden = true;
      // players
      const leader = game.finalRound ? game.finalRound.leader : -1;
      $('player-panel').innerHTML = game.players.map((p, i) => `
        <div class="player ${i === game.current && game.phase === 'play' ? 'current' : ''} ${i === leader ? 'leader' : ''}">
          <div>${esc(playerName(p.id))}${i === leader ? ' 👑' : ''}</div>
          <div class="player-score">${p.score.toLocaleString()}</div>
          <div class="turn-total">${i === game.current && game.turn ? 'Turn: ' + game.turn.turnTotal.toLocaleString() : ''}</div>
        </div>`).join('');

      // message from last event
      if (lastEvent) setMessage(eventText(lastEvent), lastEvent.type === 'gameOver' || lastEvent.type === 'instantWin');

      // turn info + dice + buttons
      const t = game.turn;
      if (game.phase === 'over') {
        const w = game.players[game.winner];
        setMessage(`🏆 ${esc(playerName(w.id))} WINS with ${w.score.toLocaleString()}!` +
          (game.winReason === 'sixOfAKind' ? ' (SIX OF A KIND — INSTANT WIN!)' : ''), true);
        const sorted = [...game.players].sort((a, b) => b.score - a.score);
        $('standings').innerHTML =
          '<h2>Final standings</h2><table class="lb"><tr><th>#</th><th>Player</th><th>Score</th></tr>' +
          sorted.map((p, i) =>
            `<tr><td>${i + 1}${i === 0 ? ' 🏆' : ''}</td><td>${esc(playerName(p.id))}</td><td>${p.score.toLocaleString()}</td></tr>`).join('') +
          '</table>';
        $('gameover-actions').hidden = false;
        $('rematch-btn').style.display = (me && room.hostId === me.id) ? '' : 'none';
        $('turn-info').textContent = '';
        $('dice-area').innerHTML = '';
        paintButtons();
        refreshProfile();
        return;
      }
      if (!t) { $('turn-info').textContent = ''; $('dice-area').innerHTML = ''; paintButtons(); return; }

      const mine = isMyTurn();
      const acts = Object.keys(t.activated).filter(f => t.activated[f]);
      $('turn-info').textContent =
        (mine ? 'Your turn — ' : `${playerName(game.players[game.current].id)}'s turn — `) +
        `turn total ${t.turnTotal.toLocaleString()} · ${t.diceRemaining} dice` +
        (acts.length ? ` · activated: ${acts.join(', ')}` : '') +
        (game.finalRound ? ' · FINAL ROUND' : '');

      const area = $('dice-area');
      area.innerHTML = '';
      const bustedDice = lastEvent && lastEvent.type === 'bust' && lastEvent.detail && lastEvent.detail.dice;
      if (bustedDice) {
        bustedDice.forEach((v, i) => area.appendChild(createDie(v, i, false)));
      } else {
        t.rolled.forEach((v, i) => area.appendChild(createDie(v, i, mine && t.awaiting === 'keep')));
      }
      if (t.rolled.length === 0 && t.awaiting === 'roll') {
        area.innerHTML = '<div style="opacity:0.7; align-self:center">Press Roll Dice 🎲</div>';
      }
      paintButtons();
    }

    function paintButtons() {
      const t = game && game.turn;
      const mine = isMyTurn();
      $('roll-btn').disabled = !(mine && t && (t.awaiting === 'roll' || t.awaiting === 'decision'));
      $('keep-btn').disabled = !(mine && t && t.awaiting === 'keep' && selected.size > 0);
      $('bank-btn').disabled = !(mine && t && t.canBank);
    }

    function eventText(e) {
      const n = esc(e.actorName || '');
      const d = e.detail || {};
      switch (e.type) {
        case 'roomCreated': return `Room ${esc(d.code)} created. Waiting for players…`;
        case 'playerJoined': return `${n} joined the room.`;
        case 'playerLeft': return `${n} left.`;
        case 'gameStarted': return d.rematch ? `🔄 Rematch! ${n} won the roll-off and starts!` : `${n} won the roll-off and starts! Roll to begin.`;
        case 'rolled': return `${n} rolled.`;
        case 'kept': return `${n} kept [${(d.kept || []).join(', ')}] (+${(d.delta || 0).toLocaleString()}).`;
        case 'hotDice': return `🔥 ${n} scored with EVERY die — AND ROLLING! (+${(d.delta || 0).toLocaleString()})`;
        case 'doubles': return `🎉 ${n} hit DOUBLES — AND ROLLING! Roll all 6 again!`;
        case 'bust': return `💥 ${n} BUSTED! Turn over.`;
        case 'banked': return `${n} banked ${(d.banked || 0).toLocaleString()} (total ${(d.score || 0).toLocaleString()}).`;
        case 'instantWin': return `🏆 ${n} rolled SIX OF A KIND — INSTANT WIN!`;
        case 'gameOver': return `🏆 GAME OVER`;
        default: return '';
      }
    }

    async function refreshProfile() {
      try {
        const d = await api('/api/me');
        me = d.user;
        skinClass = 'skin-' + Math.min(me.level - 1, 7);
      } catch (e) { /* ignore */ }
    }

    // ---------- boot ----------
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
    (async function boot() {
      if (!token) return show('screen-auth');
      try { await enterLobby(); }
      catch (e) { token = null; localStorage.removeItem('farkle_token'); show('screen-auth'); }
    })();
  </script>
</body>
</html>
