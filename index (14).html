<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1040">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dice Dash">
  <meta name="description" content="The progressive 10,000-style dice game to 12,000 — online multiplayer, persistent scores, level-up dice skins.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <title>Dice Dash 12,000 — Progressive Dice Game</title>
  <style>
    /* Modern Miniclip-style theme: playful rounded font, chunky colorful
       buttons, rich violet night background, lots of color */
    body {
      font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #2d1b69 0%, #150a33 55%, #05030f 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
      font-size: 2.5em;
      margin: 0 0 20px;
      text-align: center;
      color: #ffd700;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .title-grad {
      background: linear-gradient(90deg, #ffe600, #ff7a00, #ff2d78);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 10px rgba(255,45,120,0.45));
    }
    h2 { font-family: 'Fredoka', 'Nunito', system-ui, sans-serif; color: #ffe600; margin-top: 0; }
    .game-board {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 28px;
      padding: 30px;
      max-width: 800px;
      width: 95%;
      box-shadow: 0 14px 40px rgba(0,0,0,0.55);
      margin-bottom: 20px;
    }
    .player-panel {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      flex-wrap: nowrap;
      gap: 8px;
    }
    .player {
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      padding: 12px 8px;
      flex: 1;
      min-width: 0;
      text-align: center;
      transition: all 0.3s;
    }
    /* Seat colors: every player gets their own color (Miniclip-style) */
    .player.seat-0 { border-color: #ffe600; }
    .player.seat-0 > div:first-child { color: #ffe600; font-weight: 800; text-shadow: 0 0 8px rgba(255,230,0,0.8); }
    .player.seat-1 { border-color: #b967ff; }
    .player.seat-1 > div:first-child { color: #d8b4fe; font-weight: 800; text-shadow: 0 0 8px rgba(185,103,255,0.8); }
    .player.seat-2 { border-color: #00e5ff; }
    .player.seat-2 > div:first-child { color: #a5f3fc; font-weight: 800; text-shadow: 0 0 8px rgba(0,229,255,0.8); }
    .player.seat-3 { border-color: #ff2d78; }
    .player.seat-3 > div:first-child { color: #fda4af; font-weight: 800; text-shadow: 0 0 8px rgba(255,45,120,0.8); }
    .player.seat-4 { border-color: #ff7a00; }
    .player.seat-4 > div:first-child { color: #fdba74; font-weight: 800; text-shadow: 0 0 8px rgba(255,122,0,0.8); }
    .player.seat-5 { border-color: #3d7bff; }
    .player.seat-5 > div:first-child { color: #93c5fd; font-weight: 800; text-shadow: 0 0 8px rgba(61,123,255,0.8); }
    .player.current {
      background: rgba(255,230,0,0.16);
      border-color: #ffe600;
      transform: scale(1.05);
      box-shadow: 0 0 22px rgba(255,230,0,0.55);
    }
    /* Current player's box glows in their own seat color (replaces the banner) */
    .player.seat-0.current { border-color: #ffe600; background: rgba(255,230,0,0.20); box-shadow: 0 0 26px rgba(255,230,0,0.65); transform: scale(1.06); }
    .player.seat-1.current { border-color: #b967ff; background: rgba(185,103,255,0.20); box-shadow: 0 0 26px rgba(185,103,255,0.65); transform: scale(1.06); }
    .player.seat-2.current { border-color: #00e5ff; background: rgba(0,229,255,0.20); box-shadow: 0 0 26px rgba(0,229,255,0.65); transform: scale(1.06); }
    .player.seat-3.current { border-color: #ff2d78; background: rgba(255,45,120,0.20); box-shadow: 0 0 26px rgba(255,45,120,0.65); transform: scale(1.06); }
    .player.seat-4.current { border-color: #ff7a00; background: rgba(255,122,0,0.20); box-shadow: 0 0 26px rgba(255,122,0,0.65); transform: scale(1.06); }
    .player.seat-5.current { border-color: #3d7bff; background: rgba(61,123,255,0.20); box-shadow: 0 0 26px rgba(61,123,255,0.65); transform: scale(1.06); }
    .player.leader { border-color: #ff4500; }
    .player-score { font-size: 1.3em; font-weight: bold; color: #ffe600; }
    .turn-total { font-size: 1.2em; color: #00e5ff; }
    /* The dice table: black silk, only the dice roll here */
    /* Square dice table: dice scatter across it like a real table */
    #dice-area {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      box-sizing: border-box;
      margin: 30px auto;
      min-height: 0;
      padding: 20px;
      background: linear-gradient(135deg, #1c1c26 0%, #0d0d14 50%, #16161f 100%);
      border: 1px solid rgba(255,215,0,0.35);
      border-radius: 20px;
      box-shadow: inset 0 2px 18px rgba(0,0,0,0.8), 0 0 28px rgba(185,103,255,0.45);
    }
    /* Dice: 3x3 grid pips, level skins */
    .die {
      width: 80px;
      height: 80px;
      border: 3px solid #333;
      border-radius: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 8px;
      box-sizing: border-box;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      background: #fff;
    }
    .die.clickable:hover { transform: scale(1.05); }
    .die:not(.clickable) { cursor: default; }
    .die.selected {
      border-color: #ffd700;
      box-shadow: 0 0 20px #ffd700;
      animation: pulse 1s infinite;
    }
    .die.rolled { animation: rollShake 0.6s ease-in-out; }
    @keyframes rollShake {
      0%, 100% { transform: translate(0); }
      25% { transform: translate(5px, -5px) rotate(5deg); }
      75% { transform: translate(-5px, 5px) rotate(-5deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .pip {
      width: 75%;
      height: 75%;
      border-radius: 50%;
      background: #333;
      place-self: center;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.3);
    }
    /* Level skins (unlocked by playing games) */
    .die.skin-1 { background: #ffd9d9; border-color: #8b1a1a; }
    .die.skin-1 .pip { background: #8b1a1a; }
    .die.skin-2 { background: #1c1c2a; border-color: #5555aa; }
    .die.skin-2 .pip { background: #ddd; }
    .die.skin-3 { background: #fff3c4; border-color: #b8860b; }
    .die.skin-3 .pip { background: #7a5c00; }
    .die.skin-4 { background: #e8fbff; border-color: #00bcd4; box-shadow: 0 0 12px #00bcd4; }
    .die.skin-4 .pip { background: #006978; }
    .die.skin-5 { background: #f3e8ff; border-color: #7b2ff7; }
    .die.skin-5 .pip { background: #4a1a9e; }
    .die.skin-6 { background: #ffffff; border-color: #444; box-shadow: 0 0 14px rgba(255,255,255,0.9); }
    .die.skin-6 .pip { background: linear-gradient(135deg, #667eea, #764ba2); }
    .die.skin-7 { background: linear-gradient(135deg, #0f0c29, #302b63); border-color: #00f5ff; box-shadow: 0 0 16px #00f5ff; }
    .die.skin-7 .pip { background: radial-gradient(circle, #ffffff, #00f5ff); }
    /* 3D dice: each die is a little cube that tumbles when rolled.
       Opposite faces add to 7 (1-6, 2-5, 3-4), like a real die. */
    .die3d {
      --ds: 80px;
      width: var(--ds);
      height: var(--ds);
      perspective: 500px;
      cursor: pointer;
      flex-shrink: 0;
      transition: left 0.7s cubic-bezier(0.2, 0.8, 0.3, 1), top 0.7s cubic-bezier(0.2, 0.8, 0.3, 1);
    }
    .die3d:not(.clickable) { cursor: default; }
    .die3d.clickable:hover { transform: scale(1.05); }
    .die3d.selected { transform: translateY(-4px); }
    .die3d .cube {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }
    .die3d .face {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 8px;
      box-sizing: border-box;
      background: #fff;
      border: 3px solid #333;
      border-radius: 12px;
      backface-visibility: hidden;
    }
    .die3d .face.front { transform: rotateY(0deg) translateZ(calc(var(--ds) / 2)); }
    .die3d .face.back { transform: rotateY(180deg) translateZ(calc(var(--ds) / 2)); }
    .die3d .face.right { transform: rotateY(90deg) translateZ(calc(var(--ds) / 2)); }
    .die3d .face.left { transform: rotateY(-90deg) translateZ(calc(var(--ds) / 2)); }
    .die3d .face.top { transform: rotateX(90deg) translateZ(calc(var(--ds) / 2)); }
    .die3d .face.bottom { transform: rotateX(-90deg) translateZ(calc(var(--ds) / 2)); }
    /* 3D dice wear the same level skins as the flat dice */
    .die3d.skin-1 .face { background: #ffd9d9; border-color: #8b1a1a; }
    .die3d.skin-1 .face .pip { background: #8b1a1a; }
    .die3d.skin-2 .face { background: #1c1c2a; border-color: #5555aa; }
    .die3d.skin-2 .face .pip { background: #ddd; }
    .die3d.skin-3 .face { background: #fff3c4; border-color: #b8860b; }
    .die3d.skin-3 .face .pip { background: #7a5c00; }
    .die3d.skin-4 .face { background: #e8fbff; border-color: #00bcd4; box-shadow: 0 0 12px #00bcd4; }
    .die3d.skin-4 .face .pip { background: #006978; }
    .die3d.skin-5 .face { background: #f3e8ff; border-color: #7b2ff7; }
    .die3d.skin-5 .face .pip { background: #4a1a9e; }
    .die3d.skin-6 .face { background: #ffffff; border-color: #444; box-shadow: 0 0 14px rgba(255,255,255,0.9); }
    .die3d.skin-6 .face .pip { background: linear-gradient(135deg, #667eea, #764ba2); }
    .die3d.skin-7 .face { background: linear-gradient(135deg, #0f0c29, #302b63); border-color: #00f5ff; box-shadow: 0 0 16px #00f5ff; }
    .die3d.skin-7 .face .pip { background: radial-gradient(circle, #ffffff, #00f5ff); }
    /* Selected 3D die: gold trim + glow (comes after skins so it wins) */
    .die3d.selected .face { border-color: #ffe600; box-shadow: 0 0 24px rgba(255,230,0,0.85); }
    /* Kept dice row: dice kept so far this roll set, visible to both players */
    #kept-area {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0 0;
      min-height: 0;
      font-size: 0.95em;
      color: #ffe600;
    }
    .die.kept {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      padding: 0;
      font-size: 20px;
      font-weight: 800;
      cursor: default;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      color: #333;
    }
    .die.kept.skin-1 { color: #8b1a1a; }
    .die.kept.skin-2 { color: #ddd; }
    .die.kept.skin-3 { color: #7a5c00; }
    .die.kept.skin-4 { color: #006978; }
    .die.kept.skin-5 { color: #4a1a9e; }
    .die.kept.skin-6 { color: #444; }
    .die.kept.skin-7 { color: #fff; }
    .history-row {
      background: rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 10px 14px;
      margin: 6px 0;
      font-size: 0.95em;
    }
    button {
      font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
      background: linear-gradient(#ffe600, #ff7a00);
      border: none;
      border-bottom: 4px solid rgba(0,0,0,0.28);
      border-radius: 28px;
      padding: 15px 30px;
      font-size: 1.2em;
      font-weight: 600;
      color: #3a1c00;
      cursor: pointer;
      margin: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45), 0 0 18px rgba(255,200,0,0.35);
      transition: all 0.15s;
      min-width: 120px;
      text-shadow: none;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,0,0,0.5), 0 0 22px rgba(255,200,0,0.45); }
    button:active { transform: translateY(2px); border-bottom-width: 1px; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    /* Game actions get their own neon colors (Miniclip-style) */
    #roll-btn { background: linear-gradient(#ffe600, #ff7a00); color: #3a1c00; box-shadow: 0 6px 18px rgba(0,0,0,0.45), 0 0 18px rgba(255,200,0,0.5); }
    #keep-btn { background: linear-gradient(#d8b4fe, #9333ea); color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,0.45), 0 0 18px rgba(147,51,234,0.5); }
    #bank-btn { background: linear-gradient(#00e5ff, #3d7bff); color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,0.45), 0 0 18px rgba(0,229,255,0.5); }
    input, select {
      padding: 12px;
      font-size: 1.1em;
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,0.25);
      margin: 10px;
      font-family: inherit;
      background: #1e1b3a;
      color: #fff;
    }
    input:focus, select:focus { border-color: #b967ff; outline: none; box-shadow: 0 0 0 3px rgba(185,103,255,0.45); }
    #join-code { width: 120px; text-transform: uppercase; text-align: center; }
    #turn-info {
      text-align: center;
      font-size: 1em;
      color: #00e5ff;
      min-height: 24px;
      margin-bottom: 10px;
    }
    .win { color: #ff4500; font-size: 2em; animation: celebrate 1s infinite; }
    @keyframes celebrate {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    .error { color: #ff8888; margin-top: 10px; min-height: 24px; }
    .row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; }
    #room-code-big {
      font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
      font-size: 3em;
      background: linear-gradient(90deg, #ffe600, #ff7a00);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 0.3em;
      text-align: center;
      margin: 10px 0;
    }
    .room-player {
      background: rgba(255,255,255,0.1);
      border: 2px solid #ffd700;
      border-radius: 14px;
      padding: 10px 20px;
      margin: 5px;
      font-weight: 700;
    }
    .room-player.seat-0 { border-color: #ffe600; }
    .room-player.seat-1 { border-color: #b967ff; }
    .room-player.seat-2 { border-color: #00e5ff; }
    .room-player.seat-3 { border-color: #ff2d78; }
    .room-player.seat-4 { border-color: #ff7a00; }
    .room-player.seat-5 { border-color: #3d7bff; }
    table.lb { width: 100%; border-collapse: collapse; margin-top: 10px; }
    table.lb td, table.lb th { padding: 8px; border-bottom: 1px solid rgba(255,215,0,0.3); text-align: left; }
    table.lb th { color: #ffd700; }
    @media (max-width: 600px) {
      /* Phone fit (Miniclip-style): everything scales to the screen, no sideways scroll */
      body { padding: 8px; }
      h1 { font-size: 1.6em; margin-bottom: 10px; }
      .game-board { padding: 15px; }
      #dice-area { gap: 6px; margin: 15px auto; min-height: 0; padding: 8px; }
      .die { width: clamp(38px, 11vw, 60px); height: clamp(38px, 11vw, 60px); padding: 5px; }
      .die3d { --ds: clamp(38px, 11vw, 60px); }
      .die3d .face { padding: 4px; border-width: 2px; border-radius: 8px; }
      button { padding: 12px 20px; font-size: 1.05em; margin: 6px; }
      #game-actions button { flex: 1; min-width: 0; padding: 12px 6px; font-size: 1em; margin: 4px; }
      /* Game screen fits one phone screen: buttons pinned at the bottom */
      #screen-game:not([hidden]) { display: flex; flex-direction: column; min-height: 100vh; min-height: calc(100dvh - 16px); box-sizing: border-box; margin-bottom: 0; }
      #game-actions { margin-top: auto; }
      #room-code-big { font-size: 2.2em; }
      .player { padding: 8px 4px; min-width: 0; flex: 1; }
      .player-score { font-size: 1.1em; }
      .player > div:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .turn-total { font-size: 0.9em; }
    }
  </style>
</head>
<body>
  <h1>🎲 <span class="title-grad">Crystal's 12,000 Dice Dash</span> 🎲</h1>

  <!-- AUTH -->
  <section id="screen-auth" class="game-board">
    <h2>Log in / Sign up</h2>
    <div class="row">
      <input id="auth-user" placeholder="username" maxlength="20" autocomplete="username">
      <input id="auth-pass" type="password" placeholder="password" autocomplete="current-password">
    </div>
    <div class="row">
      <button onclick="doRegister()">Sign up</button>
      <button onclick="doLogin()">Log in</button>
    </div>
    <div id="auth-error" class="error"></div>
    <p style="opacity:0.8">Your scores, wins and level are saved to your account.</p>
  </section>

  <!-- LOBBY -->
  <section id="screen-lobby" class="game-board" hidden>
    <div id="profile-line"></div>
    <h2>Play</h2>
    <div class="row">
      <select id="bank-rule">
        <option value="house">House rule: bank with 1 die left</option>
        <option value="classic">Classic: bank with 2 dice left</option>
      </select>
      <button onclick="doCreateRoom()">Create Room</button>
    </div>
    <div class="row">
      <input id="join-code" placeholder="CODE" maxlength="4">
      <button onclick="doJoinRoom()">Join Room</button>
    </div>
    <div id="lobby-error" class="error"></div>
    <h2>Leaderboard</h2>
    <div id="leaderboard">Loading…</div>
    <h2>Recent games</h2>
    <div id="recent-games">Loading…</div>
    <div class="row"><button onclick="doLogout()">Log out</button></div>
  </section>

  <!-- ROOM -->
  <section id="screen-room" class="game-board" hidden>
    <h2>Room</h2>
    <div id="room-code-big">----</div>
    <p style="text-align:center; opacity:0.85">Share this code with your crew. 2–6 players.</p>
    <div class="row" id="room-players"></div>
    <div class="row">
      <button id="start-btn" onclick="doStartGame()">Start Game</button>
      <button onclick="doShare()">📤 Share room</button>
      <button onclick="doLeaveRoom()">Leave</button>
    </div>
    <div id="room-error" class="error"></div>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="game-board" hidden>
    <div style="position:relative; text-align:right;">
      <button onclick="toggleMenu()" style="min-width:0; padding:8px 14px; margin:0; font-size:1.2em;">☰</button>
      <div id="game-menu" hidden style="position:absolute; right:0; top:100%; background:#1e1b3a; border:2px solid #b967ff; border-radius:14px; padding:8px; z-index:10;">
        <button id="music-menu-btn" onclick="toggleMusic()" style="margin:0;">🎵 Music: Off</button>
        <button id="mymusic-menu-btn" onclick="pickCustomMusic()" style="margin:0;">🎶 My Music…</button>
        <button onclick="doShare()" style="margin:0;">📤 Share game</button>
        <button id="rematch-menu-btn" onclick="doRematch()" hidden style="margin:0;">🔄 Rematch</button>
        <button id="back-menu-btn" onclick="doLeaveRoom()" hidden style="margin:0;">Back to lobby</button>
        <button onclick="doLeaveRoom()" style="margin:0;">Leave game</button>
      </div>
    </div>
    <div class="player-panel" id="player-panel"></div>
    <div id="turn-info"></div>
    <div id="kept-area"></div>
    <div id="dice-area"></div>
    <div id="standings"></div>
    <div class="row" id="game-actions">
      <button id="roll-btn" onclick="doRoll()">Roll</button>
      <button id="keep-btn" onclick="doKeep()">Keep</button>
      <button id="bank-btn" onclick="doBank()">Bank</button>
    </div>
    <input type="file" id="music-file" accept="audio/*" hidden onchange="onCustomFile()">
    <audio id="custom-audio" loop hidden></audio>
  </section>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script>
    let token = localStorage.getItem('farkle_token');
    let me = null;
    let socket = null;
    let room = null;
    let game = null;
    let selected = new Set();
    let skinClass = 'skin-0';

    const $ = id => document.getElementById(id);
    function show(id) {
      ['screen-auth','screen-lobby','screen-room','screen-game'].forEach(s => $(s).hidden = (s !== id));
      $('game-menu').hidden = true;
    }
    function toggleMenu() { $('game-menu').hidden = !$('game-menu').hidden; }

    // Buzzer sound on bust (Web Audio, no sound files needed)
    let audioCtx = null;
    function playBuzzer() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, t);
        osc.frequency.setValueAtTime(110, t + 0.25);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.5);
      } catch (e) { /* sound is optional, never break the game */ }
    }

    // Background music: original jazzy casino loop (Casino Night style, not the Sonic tune)
    const NOTE = { C3:130.81, G2:98.00, A2:110.00, E3:164.81, D3:146.83, G3:196.00, B3:246.94, C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A3:220.00, B4:493.88, A4:440.00, C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, C6:1046.50 };
    const MUSIC_CHORDS = [ ['C4','E4','G4','B4'], ['A3','C4','E4','G4'], ['D4','F4','A4','C5'], ['G3','B3','D4','F4'] ];
    const MUSIC_BASS = [ ['C3','C3','G2','C3'], ['A2','A2','E3','A2'], ['D3','D3','A2','D3'], ['G2','G2','D3','G2'] ];
    const MUSIC_MELODY = [ 'E5',null,'G5',null,'C6',null,'G5','E5', 'C5',null,'E5',null,'A5',null,'G5','E5', 'D5',null,'F5',null,'A5',null,'F5','D5', 'D5',null,'B4',null,'G5',null,'F5','D5' ];
    const MUSIC_STEP = 60 / 132 / 2;
    let musicOn = false, musicTimer = null, musicStep = 0;
    function playTone(freq, when, dur, type, vol) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(vol, when + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(when); o.stop(when + dur + 0.05);
    }
    function musicTick() {
      if (!musicOn || !audioCtx) return;
      const bar = Math.floor(musicStep / 8) % 4;
      const s = musicStep % 8;
      const now = audioCtx.currentTime;
      if (s === 0) MUSIC_CHORDS[bar].forEach(n => playTone(NOTE[n], now, 1.7, 'triangle', 0.035));
      if (s % 2 === 0) playTone(NOTE[MUSIC_BASS[bar][s / 2]], now, 0.22, 'triangle', 0.09);
      const m = MUSIC_MELODY[musicStep % 32];
      if (m) playTone(NOTE[m], now, 0.2, 'square', 0.03);
      musicStep++;
    }
    function toggleMusic() {
      musicOn = !musicOn;
      if (musicOn && customPlaying) stopCustomMusic();
      if (musicOn) {
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          musicStep = 0;
          musicTick();
          musicTimer = setInterval(musicTick, MUSIC_STEP * 1000);
        } catch (e) { musicOn = false; }
      } else if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
      const btn = $('music-menu-btn');
      if (btn) btn.textContent = musicOn ? '🎵 Music: On' : '🎵 Music: Off';
    }

    // Player's own music: pick a song from their phone, plays on their device only
    let customPlaying = false;
    function pickCustomMusic() {
      if (customPlaying) { stopCustomMusic(); return; }
      $('music-file').click();
    }
    function onCustomFile() {
      const input = $('music-file');
      const f = input.files && input.files[0];
      if (!f) return;
      if (musicOn) toggleMusic();
      const a = $('custom-audio');
      if (a.src) URL.revokeObjectURL(a.src);
      a.src = URL.createObjectURL(f);
      a.loop = true;
      a.volume = 0.5;
      a.play().catch(() => {});
      customPlaying = true;
      const btn = $('mymusic-menu-btn');
      const name = f.name.length > 22 ? f.name.slice(0, 21) + '…' : f.name;
      if (btn) btn.textContent = '🎶 ' + name;
    }
    function stopCustomMusic() {
      const a = $('custom-audio');
      if (a) { a.pause(); a.removeAttribute('src'); a.load(); }
      customPlaying = false;
      const btn = $('mymusic-menu-btn');
      if (btn) btn.textContent = '🎶 My Music…';
    }
    function err(id, msg) { $(id).textContent = msg || ''; }

    async function api(path, method = 'GET', body) {
      const res = await fetch(path, {
        method,
        headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'request failed');
      return data;
    }

    // ---------- auth ----------
    async function doRegister() {
      try {
        const d = await api('/api/register', 'POST', { username: $('auth-user').value, password: $('auth-pass').value });
        token = d.token; localStorage.setItem('farkle_token', token);
        await enterLobby();
      } catch (e) { err('auth-error', e.message); }
    }
    async function doLogin() {
      try {
        const d = await api('/api/login', 'POST', { username: $('auth-user').value, password: $('auth-pass').value });
        token = d.token; localStorage.setItem('farkle_token', token);
        await enterLobby();
      } catch (e) { err('auth-error', e.message); }
    }
    function doLogout() {
      token = null; localStorage.removeItem('farkle_token');
      if (socket) { socket.disconnect(); socket = null; }
      room = null; game = null;
      show('screen-auth');
    }

    // ---------- lobby ----------
    async function enterLobby() {
      const d = await api('/api/me');
      me = d.user;
      skinClass = 'skin-' + Math.min(me.level - 1, 7);
      const progress = me.nextSkin
        ? ` · ${me.gamesToNextLevel} game${me.gamesToNextLevel === 1 ? '' : 's'} to Level ${me.level + 1} (${esc(me.nextSkin)} dice)`
        : ' · max level 👑';
      $('profile-line').innerHTML =
        `<b>${esc(me.username)}</b> · Level ${me.level} · 🎲 ${esc(me.diceSkin)}` +
        ` · ${me.gamesPlayed} games · ${me.wins} wins · ${me.totalPoints.toLocaleString()} pts${progress}`;
      const lb = await api('/api/leaderboard');
      $('leaderboard').innerHTML = lb.leaderboard.length
        ? '<table class="lb"><tr><th>#</th><th>Player</th><th>Wins</th><th>Points</th><th>Level</th></tr>' +
          lb.leaderboard.map((p, i) =>
            `<tr><td>${i+1}</td><td>${esc(p.username)}</td><td>${p.wins}</td><td>${p.totalPoints.toLocaleString()}</td><td>${p.level}</td></tr>`).join('') +
          '</table>'
        : 'No players yet. Be the first legend.';
      try {
        const h = await api('/api/history');
        $('recent-games').innerHTML = h.games.length
          ? h.games.map(g =>
              `<div class="history-row">🏆 <b>${esc(g.winner)}</b>` +
              ` · ${g.playerCount} players` +
              ` · ${g.scores.map(s => `${esc(s.username)} ${s.score.toLocaleString()}`).join(' · ')}` +
              `${g.winReason === 'sixOfAKind' ? ' · ⚡ instant win' : ''}</div>`).join('')
          : 'No games played yet.';
      } catch (e) { $('recent-games').textContent = ''; }
      connectSocket();
      show('screen-lobby');
    }

    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    // ---------- socket ----------
    function connectSocket() {
      if (socket) socket.disconnect();
      socket = io({ auth: { token } });
      socket.on('connect_error', e => err('lobby-error', 'Connection failed: ' + e.message));
      socket.on('state', onState);
    }

    function doCreateRoom() {
      socket.emit('createRoom', { bankRule: $('bank-rule').value }, ack => {
        if (!ack.ok) err('lobby-error', ack.error);
      });
    }
    function doJoinRoom() {
      const code = $('join-code').value.trim().toUpperCase();
      if (!code) return err('lobby-error', 'Enter a room code.');
      socket.emit('joinRoom', { code }, ack => {
        if (!ack.ok) err('lobby-error', ack.error);
      });
    }
    function doStartGame() {
      socket.emit('startGame', {}, ack => {
        if (!ack.ok) err('room-error', ack.error);
      });
    }
    function doLeaveRoom() {
      if (musicOn) toggleMusic();
      if (customPlaying) stopCustomMusic();
      if (socket) socket.emit('leaveRoom', {}, () => {});
      room = null; game = null; selected = new Set();
      enterLobby();
    }

    // Share the game (room code included when in a room)
    async function doShare() {
      const url = window.location.origin;
      const text = room && room.code
        ? 'Join my Dice Dash 12,000 game! Room code: ' + room.code + ' — ' + url
        : 'Come play Dice Dash 12,000 with me! ' + url;
      try {
        if (navigator.share) {
          await navigator.share({ title: 'Dice Dash 12,000', text: text, url: url });
          return;
        }
        if (navigator.clipboard) await navigator.clipboard.writeText(text);
        if (game) setMessage('Link copied! Share it with your friends.');
        else err('room-error', 'Link copied! Share it with your friends.');
      } catch (e) { /* share cancelled or unavailable — ignore */ }
    }

    // ---------- game actions ----------
    function doRoll() {
      socket.emit('roll', {}, ack => {
        if (!ack.ok) setMessage('⚠️ ' + ack.error);
      });
    }
    function doKeep() {
      if (selected.size === 0) return setMessage('Select dice to keep first.');
      socket.emit('keep', { indices: [...selected] }, ack => {
        if (!ack.ok) setMessage('⚠️ ' + ack.error);
        else selected = new Set();
      });
    }
    function doBank() {
      socket.emit('bank', {}, ack => {
        if (!ack.ok) setMessage('⚠️ ' + ack.error);
      });
    }
    function doRematch() {
      socket.emit('rematch', {}, ack => {
        if (!ack.ok) setMessage('⚠️ ' + ack.error);
      });
    }

    // ---------- rendering ----------
    const PIP_POS = {
      1: [5], 2: [3, 7], 3: [1, 5, 9],
      4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9],
    };

    // ---------- 3D dice ----------
    // A die is a cube: each face's rotation, and the rotation that brings
    // a value to the front (opposite faces add to 7: 1-6, 2-5, 3-4).
    const FACE_OF = { 1: 'front', 2: 'right', 3: 'top', 4: 'bottom', 5: 'left', 6: 'back' };
    const SHOW = {
      1: 'rotateX(0deg) rotateY(0deg)',
      2: 'rotateX(0deg) rotateY(-90deg)',
      3: 'rotateX(-90deg) rotateY(0deg)',
      4: 'rotateX(90deg) rotateY(0deg)',
      5: 'rotateX(0deg) rotateY(90deg)',
      6: 'rotateX(0deg) rotateY(180deg)',
    };

    // Dice scatter: every roll lands the dice at random spots on the
    // square table, at random angles, flying in from above like a throw.
    // Centers stay in [12,88]% with 24% min separation so dice never overlap.
    function scatterPositions(n) {
      const pts = [];
      let ok = true;
      for (let i = 0; i < n; i++) {
        let p = null;
        for (let t = 0; t < 60; t++) {
          const cand = { x: 12 + Math.random() * 76, y: 12 + Math.random() * 76 };
          if (pts.every(q => Math.hypot(q.x - cand.x, q.y - cand.y) >= 24)) { p = cand; break; }
        }
        if (!p) { ok = false; break; }
        pts.push(p);
      }
      if (!ok) {
        // fallback: jittered grid, never overlapping
        pts.length = 0;
        const cols = Math.ceil(Math.sqrt(n));
        const rows = Math.ceil(n / cols);
        for (let i = 0; i < n; i++) {
          const c = i % cols, r = Math.floor(i / cols);
          pts.push({
            x: (c + 0.5) * (100 / cols) + (Math.random() * 10 - 5),
            y: (r + 0.5) * (100 / rows) + (Math.random() * 10 - 5),
          });
        }
      }
      return pts.map(p => ({
        x: Math.min(88, Math.max(12, p.x)),
        y: Math.min(88, Math.max(12, p.y)),
        rz: Math.floor(Math.random() * 61) - 30,
        sx: 20 + Math.random() * 60,
      }));
    }

    function createDie(value, index, clickable, spot) {
      const wrap = document.createElement('div');
      wrap.className = 'die3d ' + skinClass + (clickable ? ' clickable' : '');
      const cube = document.createElement('div');
      cube.className = 'cube';
      // build all 6 faces so the cube tumbles like a real die
      for (const v of [1, 2, 3, 4, 5, 6]) {
        const face = document.createElement('div');
        face.className = 'face ' + FACE_OF[v];
        for (const pos of PIP_POS[v]) {
          const pip = document.createElement('div');
          pip.className = 'pip';
          pip.style.gridArea = `${Math.ceil(pos / 3)} / ${((pos - 1) % 3) + 1}`;
          face.appendChild(pip);
        }
        cube.appendChild(face);
      }
      wrap.appendChild(cube);
      if (clickable) {
        if (selected.has(index)) wrap.classList.add('selected');
        wrap.onclick = () => {
          if (selected.has(index)) { selected.delete(index); wrap.classList.remove('selected'); }
          else { selected.add(index); wrap.classList.add('selected'); }
          paintButtons();
        };
      }
      // scatter: start above the table, land on the spot at a random angle
      if (spot) {
        wrap.style.position = 'absolute';
        wrap.style.left = spot.sx + '%';
        wrap.style.top = '-14%';
        wrap.style.marginLeft = 'calc(var(--ds) / -2)';
        wrap.style.marginTop = 'calc(var(--ds) / -2)';
      }
      // tumble: start at a random angle, settle on the rolled value.
      // (Double animation frame: the first paint shows the start angle,
      // then the cube spins to its final face.)
      const rx = Math.floor(Math.random() * 720) - 360;
      const ry = Math.floor(Math.random() * 720) - 360;
      cube.style.transition = 'none';
      cube.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (spot) { wrap.style.left = spot.x + '%'; wrap.style.top = spot.y + '%'; }
        cube.style.transition = 'transform 0.7s cubic-bezier(0.2, 0.8, 0.3, 1)';
        cube.style.transform = SHOW[value] + (spot ? ` rotateZ(${spot.rz}deg)` : '');
      }));
      return wrap;
    }

    // Play-by-play line removed (Crystal: the dice + kept row show it all).
    // Kept as a safe no-op so game-over / error callers don't break.
    function setMessage(msg, isWin = false) {
      const el = $('message');
      if (!el) return;
      el.textContent = msg;
      el.className = isWin ? 'win' : '';
    }

    function playerName(userId) {
      const p = room && room.players.find(p => p.userId === userId);
      return p ? p.username : 'Player';
    }
    function isMyTurn() {
      return !!(game && game.phase === 'play' && game.turn && me &&
        game.players[game.current].id === me.id);
    }

    function onState(payload) {
      room = payload.room;
      game = payload.game;
      selected = new Set();
      if (!game) { renderRoom(); show('screen-room'); }
      else { renderGame(payload.lastEvent); show('screen-game'); }
    }

    function renderRoom() {
      $('room-code-big').textContent = room.code;
      $('room-players').innerHTML = room.players
        .map((p, i) => `<div class="room-player seat-${i % 6}">${esc(p.username)}${p.userId === room.hostId ? ' 👑' : ''}</div>`).join('');
      $('start-btn').style.display = (me && room.hostId === me.id) ? '' : 'none';
      err('room-error', '');
    }

    function renderGame(lastEvent) {
      // reset game-over UI (shown again below if the game is over)
      $('standings').innerHTML = '';
      $('rematch-menu-btn').hidden = true;
      $('back-menu-btn').hidden = true;
      // players
      const leader = game.finalRound ? game.finalRound.leader : -1;
      $('player-panel').innerHTML = game.players.map((p, i) => `
        <div class="player seat-${i % 6} ${i === game.current && game.phase === 'play' ? 'current' : ''} ${i === leader ? 'leader' : ''}">
          <div>${esc(playerName(p.id))}${i === leader ? ' 👑' : ''}</div>
          <div class="player-score">${p.score.toLocaleString()}</div>
          <div class="turn-total">${i === game.current && game.turn ? 'Turn: ' + game.turn.turnTotal.toLocaleString() : ''}</div>
        </div>`).join('');

      // message from last event
      if (lastEvent) setMessage(eventText(lastEvent), lastEvent.type === 'gameOver' || lastEvent.type === 'instantWin');
      if (lastEvent && lastEvent.type === 'bust') playBuzzer();

      // turn info + dice + buttons
      const t = game.turn;
      if (game.phase === 'over') {
        const w = game.players[game.winner];
        setMessage(`🏆 ${esc(playerName(w.id))} WINS with ${w.score.toLocaleString()}!` +
          (game.winReason === 'sixOfAKind' ? ' (SIX OF A KIND — INSTANT WIN!)' : ''), true);
        const sorted = [...game.players].sort((a, b) => b.score - a.score);
        $('standings').innerHTML =
          '<h2>Final standings</h2><table class="lb"><tr><th>#</th><th>Player</th><th>Score</th></tr>' +
          sorted.map((p, i) =>
            `<tr><td>${i + 1}${i === 0 ? ' 🏆' : ''}</td><td>${esc(playerName(p.id))}</td><td>${p.score.toLocaleString()}</td></tr>`).join('') +
          '</table>';
        $('rematch-menu-btn').hidden = false;
        $('back-menu-btn').hidden = false;
        $('rematch-menu-btn').style.display = (me && room.hostId === me.id) ? '' : 'none';
        $('turn-info').textContent = '';
        $('dice-area').innerHTML = '';
        $('kept-area').innerHTML = '';
        paintButtons();
        refreshProfile();
        return;
      }
      if (!t) { $('turn-info').textContent = ''; $('dice-area').innerHTML = ''; $('kept-area').innerHTML = ''; paintButtons(); return; }

      const mine = isMyTurn();
      const acts = Object.keys(t.activated).filter(f => t.activated[f]);
      $('turn-info').textContent =
        (mine ? 'Your turn — ' : `${playerName(game.players[game.current].id)}'s turn — `) +
        `turn total ${t.turnTotal.toLocaleString()} · ${t.diceRemaining} dice` +
        (acts.length ? ` · activated: ${acts.join(', ')}` : '') +
        (game.finalRound ? ' · FINAL ROUND' : '');

      // kept dice this roll set — visible to both players
      const keptFaces = [];
      Object.keys(t.counts).sort((a, b) => a - b).forEach(f => {
        for (let k = 0; k < t.counts[f]; k++) keptFaces.push(Number(f));
      });
      $('kept-area').innerHTML = keptFaces.length
        ? `<span>Kept:</span>` + keptFaces.map(v => `<span class="die kept ${skinClass}">${v}</span>`).join('')
        : '';

      const area = $('dice-area');
      area.innerHTML = '';
      const bustedDice = lastEvent && lastEvent.type === 'bust' && lastEvent.detail && lastEvent.detail.dice;
      const isBust = bustedDice && bustedDice.length;
      const shownDice = isBust ? bustedDice : t.rolled;
      const spots = scatterPositions(shownDice.length);
      shownDice.forEach((v, i) => area.appendChild(createDie(v, i, !isBust && mine && t.awaiting === 'keep', spots[i])));
      if (!bustedDice && t.rolled.length === 0 && t.awaiting === 'roll') {
        area.innerHTML = '<div style="opacity:0.7; align-self:center">Press Roll Dice 🎲</div>';
      }
      paintButtons();
    }

    function paintButtons() {
      const t = game && game.turn;
      const mine = isMyTurn();
      $('roll-btn').disabled = !(mine && t && (t.awaiting === 'roll' || t.awaiting === 'decision'));
      $('keep-btn').disabled = !(mine && t && t.awaiting === 'keep' && selected.size > 0);
      $('bank-btn').disabled = !(mine && t && t.canBank);
    }

    function eventText(e) {
      const n = esc(e.actorName || '');
      const d = e.detail || {};
      switch (e.type) {
        case 'roomCreated': return `Room ${esc(d.code)} created. Waiting for players…`;
        case 'playerJoined': return `${n} joined the room.`;
        case 'playerLeft': return `${n} left.`;
        case 'gameStarted': return d.rematch ? `🔄 Rematch! ${n} won the roll-off and starts!` : `${n} won the roll-off and starts! Roll to begin.`;
        case 'rolled': return `${n} rolled.`;
        case 'kept': return `${n} kept [${(d.kept || []).join(', ')}] (+${(d.delta || 0).toLocaleString()}).`;
        case 'hotDice': return `🔥 ${n} scored with EVERY die — AND ROLLING! (+${(d.delta || 0).toLocaleString()})`;
        case 'doubles': return d.kept
          ? `🎉 ${n} kept [${(d.kept || []).join(', ')}] (+${(d.delta || 0).toLocaleString()}) — DOUBLES! AND ROLLING! Roll all 6 again!`
          : `🎉 ${n} hit DOUBLES — AND ROLLING! Roll all 6 again!`;
        case 'bust': return `💥 ${n} BUSTED! Turn over.`;
        case 'banked': return `${n} banked ${(d.banked || 0).toLocaleString()} (total ${(d.score || 0).toLocaleString()}).`;
        case 'instantWin': return `🏆 ${n} rolled SIX OF A KIND — INSTANT WIN!`;
        case 'gameOver': return `🏆 GAME OVER`;
        default: return '';
      }
    }

    async function refreshProfile() {
      try {
        const d = await api('/api/me');
        me = d.user;
        skinClass = 'skin-' + Math.min(me.level - 1, 7);
      } catch (e) { /* ignore */ }
    }

    // ---------- boot ----------
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
    (async function boot() {
      if (!token) return show('screen-auth');
      try { await enterLobby(); }
      catch (e) { token = null; localStorage.removeItem('farkle_token'); show('screen-auth'); }
    })();
  </script>
</body>
</html>
